name: Build Docker image for scanning
description: Build a Mautic Docker image and upload it as an artifact

inputs:
  mautic_version:
    description: Mautic version to build
    required: true
  image_type:
    description: Image flavour to build
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Compute BASE_TAG from Mautic version
      shell: bash
      env:
        MAUTIC_VERSION: ${{ inputs.mautic_version }}
      run: |
        MAJOR=$(echo "$MAUTIC_VERSION" | cut -d. -f1)
        if [ "$MAJOR" = "5" ]; then PHPVER="8.2";
        elif [ "$MAJOR" = "6" ] || [ "$MAJOR" = "7" ]; then PHPVER="8.3";
        else echo "Unsupported Mautic major version: $MAJOR"; exit 1; fi
        echo "PHPVER=$PHPVER" >> "$GITHUB_ENV"

    - name: Build image and export locally (for SCA scan)
      uses: docker/build-push-action@v7
      with:
        file: Dockerfile
        tags: mautic-${{ inputs.image_type }}
        load: true
        platforms: linux/amd64
        build-args: |
          BASE_TAG=${{ env.PHPVER }}-${{ inputs.image_type }}-bookworm
          MAUTIC_VERSION=${{ inputs.mautic_version }}
          FLAVOUR=${{ inputs.image_type }}

    - name: Save image to tar file
      shell: bash
      run: docker save mautic-${{ inputs.image_type }} -o image.tar

    - name: Upload image as artifact
      uses: actions/upload-artifact@v7
      with:
        name: mautic-${{ inputs.image_type }}
        path: image.tar