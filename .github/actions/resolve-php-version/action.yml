name: Resolve PHP version
description: Resolve the PHP image tag from the Mautic version

inputs:
  mautic_version:
    description: Mautic version (for example 7.2.1)
    required: true

outputs:
  phpver:
    description: PHP version matching the Mautic major version
    value: ${{ steps.determine.outputs.phpver }}

runs:
  using: composite
  steps:
    - id: determine
      shell: bash
      run: |
        MAJOR=$(echo "${{ inputs.mautic_version }}" | cut -d. -f1)
        if [ "$MAJOR" = "5" ]; then
          PHPVER="8.2"
        elif [ "$MAJOR" = "6" ] || [ "$MAJOR" = "7" ]; then
          PHPVER="8.3"
        else
          echo "Unsupported Mautic major version: $MAJOR"
          exit 1
        fi
        echo "phpver=$PHPVER" >> "$GITHUB_OUTPUT"
