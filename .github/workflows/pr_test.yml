name: PR Tests
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'common/**'
      - '.github/actions/**'
      - '.github/workflows/**'

jobs:
  ###
  # Security FS
  ###
  hadolint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
    
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'fs'
          scan-ref: '.'

  ###
  # Testing
  ###
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image for scanning
        uses: ./.github/actions/build-image
        with:
          mautic_version: 7.2.1
          image_type: ${{ matrix.image_type }}

      - name: Start test image with demo data
        if: matrix.image_type == 'apache'
        run: |
          docker tag mautic-apache mautic/mautic:latest
          DOCKER_MAUTIC_LOAD_TEST_DATA=true docker compose --project-name mautic-test -f examples/basic/docker-compose.yml up --detach --wait
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://localhost:8080/login)
          if [ "$status" != "200" ]; then
            echo "Expected /login to return HTTP 200, got $status"
            exit 1
          fi

      - name: Remove test environment
        if: always() && matrix.image_type == 'apache'
        run: docker compose --project-name mautic-test -f examples/basic/docker-compose.yml down --volumes --remove-orphans

  ###
  # Security Image
  ###
  trivy-image:
    runs-on: ubuntu-latest
    needs: test-build
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan Docker image
        uses: ./.github/actions/trivyscan-image-image
        with:
          image_type: ${{ matrix.image_type }}
          format: table
          severity: CRITICAL
          exit_code: '1'
          ignore_unfixed: 'true'
          trivyignores: .trivyignore

  grype-image:
    runs-on: ubuntu-latest
    needs: test-build
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan Docker image with Grype
        uses: ./.github/actions/grype-image
        with:
          image_type: ${{ matrix.image_type }}
          fail_build: 'true'
          severity_cutoff: critical