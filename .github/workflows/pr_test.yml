name: PR Tests
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'common/**'
      - '.github/actions/**'
      - '.github/workflows/**'

jobs:
  ###
  # Security FS
  ###
  hadolint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
    
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'fs'
          scan-ref: '.'

  ###
  # Testing
  ###
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image for scanning
        uses: ./.github/actions/build-image
        with:
          mautic_version: 7.2.1
          image_type: ${{ matrix.image_type }}

  ###
  # Security Image
  ###
  trivy-image:
    runs-on: ubuntu-latest
    needs: test-build
    strategy:
      matrix:
        image_type: [apache, fpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan Docker image
        uses: ./.github/actions/scan-image
        with:
          image_type: ${{ matrix.image_type }}
          format: table
          severity: CRITICAL
          exit_code: '1'
          ignore_unfixed: 'true'
          trivyignores: .trivyignore