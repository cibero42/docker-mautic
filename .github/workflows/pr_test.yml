name: PR Tests
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'common/**'
      - '.github/workflows/**'

jobs:
  docker-build:
    uses: ./.github/workflows/build-image.yml
    with:
      mautic_version: 7.2.1

  sast:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'fs'
          scan-ref: '.'

  sca:
    runs-on: ubuntu-latest
    needs: docker-build
    strategy:
      matrix:
        image_type: [apache, fpm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: mautic-${{ matrix.image_type }}

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Run Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: 'mautic-${{ matrix.image_type }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true # Won't fail if there isn't a fix to the CVE
          trivyignores: .trivyignore